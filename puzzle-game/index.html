<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Sliding Puzzle — Smooth Animations + Solver</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;700&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="./src/styles.css" />
  </head>
  <body>
    <div id="app">
      <header class="app-header">
        <h1>Sliding Puzzle</h1>
        <div class="sub">Smooth animations • Undo • Auto-solver</div>
      </header>

      <main class="layout">
        <section class="controls card">
          <div class="control-row">
            <label for="size">Size</label>
            <select id="size">
              <option value="3">3 × 3</option>
              <option value="4" selected>4 × 4</option>
              <option value="5">5 × 5</option>
            </select>
          </div>

          <div class="control-row">
            <label>Shuffle</label>
            <div class="button-row">
              <button id="shuffleBtn" class="primary">Shuffle</button>
              <button id="resetBtn">Reset</button>
            </div>
          </div>

          <div class="control-row">
            <label>Playback</label>
            <div class="button-row">
              <button id="undoBtn">Undo</button>
              <button id="redoBtn">Redo</button>
            </div>
          </div>

          <div class="control-row">
            <label>Solver</label>
            <div class="button-row">
              <button id="solveBtn" class="accent">Solve</button>
              <button id="stopSolveBtn">Stop</button>
            </div>
            <p class="hint">Solver is optimal for 3×3, heuristic for 4×4/5×5. May take longer on larger boards.</p>
          </div>
        </section>

        <section class="board-wrap card">
          <div class="hud">
            <div class="stat"><span id="moveCount">0</span> moves</div>
            <div class="stat"><span id="time">0:00</span></div>
            <div class="stat">State: <span id="status">Ready</span></div>
          </div>

          <div id="board" class="board" aria-label="Sliding puzzle board" role="application"></div>
        </section>
      </main>

      <footer class="app-footer">
        <div>Tip: Use arrow keys to move the blank tile.</div>
      </footer>
    </div>

    <canvas id="confetti" class="confetti" aria-hidden="true"></canvas>

    <script type="module" src="./src/main.js"></script>
  </body>
</html>
